name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  style:
    name: C++ style
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install formatter
        run: python3 -m pip install clang-format==23.1.3
      - name: Check C++ style
        run: python3 scripts/check_cpp_style.py

  test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: debug
            compiler: g++-13
            compiler_package: g++-13
          - os: ubuntu-24.04
            preset: release
            compiler: g++-13
            compiler_package: g++-13
          - os: ubuntu-24.04
            preset: asan
            compiler: clang++-18
            compiler_package: clang-18
          - os: ubuntu-22.04
            preset: tsan
            compiler: clang++-14
            compiler_package: clang-14
          - os: macos-15
            preset: debug
            compiler: clang++
          - os: macos-15-intel
            preset: debug
            compiler: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.compiler_package }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2

  mysql:
    name: MySQL archive integration
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: archive-test-password
          MYSQL_DATABASE: yquant_archive_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -parchive-test-password"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      YQUANT_MYSQL_TEST_DATABASE: yquant_archive_test
      YQUANT_MYSQL_TEST_HOST: 127.0.0.1
      YQUANT_MYSQL_TEST_PORT: 3306
      YQUANT_MYSQL_TEST_USER: root
      YQUANT_MYSQL_TEST_PASSWORD: archive-test-password
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install build and database tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13 libmysqlclient-dev mysql-client
      - name: Install archive schema
        env:
          MYSQL_PWD: archive-test-password
        run: mysql -h 127.0.0.1 -uroot yquant_archive_test < sql/trading_archive_v1.sql
      - name: Configure and build
        run: |
          cmake --preset debug -DCMAKE_CXX_COMPILER=g++-13 -DYQUANT_WITH_MYSQL=ON
          cmake --build --preset debug --parallel 2 --target yquant_tradingd_test yquant_tradingd_allocation_test
      - name: Test archive and gateway
        run: |
          ./build/debug/yquant_tradingd_test
          ./build/debug/yquant_tradingd_allocation_test
