name: Build and test

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / ${{ matrix.preset }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: debug
            compiler: g++-13
            compiler_package: g++-13
          - os: ubuntu-24.04
            preset: release
            compiler: g++-13
            compiler_package: g++-13
          - os: ubuntu-24.04
            preset: asan
            compiler: clang++-18
            compiler_package: clang-18
          - os: ubuntu-22.04
            preset: tsan
            compiler: clang++-14
            compiler_package: clang-14
          - os: macos-15
            preset: debug
            compiler: clang++
          - os: macos-15-intel
            preset: debug
            compiler: clang++
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build ${{ matrix.compiler_package }}
      - name: Install macOS build tools
        if: runner.os == 'macOS'
        run: brew install cmake ninja
      - name: Configure
        run: >-
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel 2
      - name: Test
        run: ctest --preset ${{ matrix.preset }} --parallel 2
