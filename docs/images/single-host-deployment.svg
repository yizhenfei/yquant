<svg xmlns="http://www.w3.org/2000/svg" width="2200" height="1280" viewBox="0 0 2200 1280" role="img" aria-labelledby="title desc">
  <title id="title">YQuant 单机部署架构</title>
  <desc id="desc">单机部署包含一个 marketd、多个 strategyd 和一个 tradingd。策略进程及交易通道以 1 到 N 表示。图中采用 logd 后端，本机业务进程经各 Logger 独立的共享内存 SPSC 队列发送日志，由一个本机 logd 写入日志文件。</desc>
