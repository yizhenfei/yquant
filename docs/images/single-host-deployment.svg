<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">规划：单机三种进程</title><desc id="desc">同一主机运行 marketd、strategyd 和 tradingd 三种进程。strategyd 可部署多个进程实例，共用行情和交易服务；图中展开一个策略进程，其内部可以承载多个策略实例。每个进程有自己的 container 和单业务线程，每个策略进程使用独立通信通道。</desc>
<defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto-start-reverse"><path d="M0 0 L9 4.5 L0 9 Z" fill="#112D4E"/></marker></defs>
